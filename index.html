<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Panchoneta · Pedido Bebidas</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b09;--s1:#161410;--s2:#1e1b16;--border:#2e2a24;--border2:#3a342c;--mustard:#f0c040;--red:#e04848;--green:#48d888;--orange:#e87828;--blue:#4898e0;--purple:#a070e0;--teal:#40c8b0;--text:#ede8df;--text2:#b8b0a4;--muted:#706860;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
header{position:relative;padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--s1),var(--bg));overflow:hidden;}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--mustard),transparent);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:4px;color:var(--mustard);}
.logo-sub{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.filtros{padding:14px 20px;background:var(--s1);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.filtro-label{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.filtro-input{background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;outline:none;width:100%;}
.fechas-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.filtro-select{background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;width:100%;}
.shortcuts{display:flex;gap:6px;flex-wrap:wrap;}
.sc{padding:7px 12px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;font-weight:600;}
.sc.active{background:var(--mustard);color:#0c0b09;border-color:var(--mustard);}
.btn-consultar{padding:14px;background:var(--mustard);color:#0c0b09;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;cursor:pointer;width:100%;}
.btn-consultar:disabled{opacity:.4;cursor:not-allowed;}
main{padding:16px 20px;max-width:900px;}
.estado{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);gap:12px;text-align:center;}
.estado-icon{font-size:48px;opacity:.4;}
.estado-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;}
.estado-sub{font-size:12px;color:var(--border2);}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--mustard);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--mustard);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.stitle::after{content:'';flex:1;height:1px;background:var(--border);margin-left:8px;}
.section{margin-bottom:28px;}
.tw{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;}
table.dt{width:100%;border-collapse:collapse;font-size:12px;}
table.dt th{text-align:left;padding:8px 14px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
table.dt td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle;}
table.dt tr:last-child td{border-bottom:none;}
.num{font-family:'DM Mono',monospace;font-size:12px;text-align:right;}th.num{text-align:right;}
.pack-badge{display:inline-block;background:var(--mustard);color:#0c0b09;font-family:'Bebas Neue',sans-serif;font-size:18px;padding:4px 12px;border-radius:6px;min-width:50px;text-align:center;}
.pack-badge.warn{background:#e04848;color:#fff;}
.pack-badge.ok{background:#48d888;color:#0c0b09;}
.categoria-header{background:var(--s2);padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.info-box{background:rgba(72,152,224,.08);border:1px solid rgba(72,152,224,.25);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:var(--text2);line-height:1.6;}
.suc-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
.suc-tab{padding:6px 14px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;}
.suc-tab.active{background:var(--mustard);color:#0c0b09;border-color:var(--mustard);}
.resumen-pedido{background:var(--s1);border:1px solid var(--mustard);border-radius:12px;padding:16px 20px;margin-bottom:20px;}
.resumen-title{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--mustard);letter-spacing:2px;margin-bottom:12px;}
.resumen-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.resumen-item:last-child{border-bottom:none;}
.resumen-nombre{font-size:13px;color:var(--text);}
.resumen-packs{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--mustard);}
.resumen-sub{font-size:10px;color:var(--muted);}
footer{padding:14px 20px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;display:flex;justify-content:space-between;}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">🥤 La Panchoneta</div>
    <div class="logo-sub">Pedido de Bebidas · Coca-Cola</div>
  </div>
  <div style="text-align:right;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)" id="headerInfo"></div>
</header>

<div class="filtros">
  <div>
    <div class="filtro-label">Atajos rápidos</div>
    <div class="shortcuts">
      <button class="sc" onclick="setShortcut('semana_ant',this)">Sem. anterior</button>
      <button class="sc" onclick="setShortcut('semana',this)">Esta semana</button>
      <button class="sc" onclick="setShortcut('mes',this)">Este mes</button>
      <button class="sc" onclick="setShortcut('mes_ant',this)">Mes anterior</button>
    </div>
  </div>
  <div class="fechas-row">
    <div><div class="filtro-label">Desde</div><input type="date" class="filtro-input" id="inputDesde"></div>
    <div><div class="filtro-label">Hasta</div><input type="date" class="filtro-input" id="inputHasta"></div>
  </div>
  <div>
    <div class="filtro-label">Sucursales (podés elegir más de una)</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
      <label style="display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;cursor:pointer">
        <input type="checkbox" id="suc_todas" checked onchange="toggleTodas(this)" style="width:16px;height:16px;accent-color:#f0c040">
        <span style="font-size:13px;color:var(--text)">Todas las sucursales</span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;cursor:pointer">
        <input type="checkbox" class="suc-check" value="Bv. Sarmiento" onchange="updateTodas()" style="width:16px;height:16px;accent-color:#e87828">
        <span style="font-size:13px;color:#e87828;font-weight:600">🏠 Casa Central (Bv. Sarmiento)</span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;cursor:pointer">
        <input type="checkbox" class="suc-check" value="Terminal de Ómnibus" onchange="updateTodas()" style="width:16px;height:16px;accent-color:#a070e0">
        <span style="font-size:13px;color:#a070e0;font-weight:600">🚌 Terminal de Ómnibus</span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;cursor:pointer">
        <input type="checkbox" class="suc-check" value="Villa María Shopping" onchange="updateTodas()" style="width:16px;height:16px;accent-color:#4898e0">
        <span style="font-size:13px;color:#4898e0;font-weight:600">🛍️ Villa María Shopping</span>
      </label>
    </div>
  </div>
    <div style="display:flex;gap:8px;margin-top:4px">
    <button onclick="setTab('pedido')" id="tab-pedido" style="flex:1;padding:10px;background:var(--mustard);color:#0c0b09;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;cursor:pointer">📦 PEDIDO SEMANAL</button>
    <button onclick="setTab('stock')" id="tab-stock" style="flex:1;padding:10px;background:var(--s2);color:var(--muted);border:1px solid var(--border2);border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;cursor:pointer">🏪 CON STOCK</button>
  </div>
  <button class="btn-consultar" id="btnConsultar" onclick="consultar()">CALCULAR PEDIDO</button>
</div>

<main id="mainContent">
  <div class="estado">
    <div class="estado-icon">🥤</div>
    <div class="estado-title">Calculá tu pedido de bebidas</div>
    <div class="estado-sub">Seleccioná el período y la sucursal para ver las unidades vendidas y los packs a reponer</div>
  </div>
</main>

<footer>
  <span>La Panchoneta · Pedido Bebidas Coca-Cola</span>
  <span id="footerInfo">—</span>
</footer>

<script>
const API_BASE = "https://api.lapanchoneta.com/api/ext";
const API_KEY = "pk_pancho_2026";

// ── Configuración de bebidas ────────────────────────────────────────────────
const BEBIDAS_CONFIG = [
  // LATAS 354cc - pack 6
  { categoria: "🥫 Latas 354cc", nombre: "Coca Lata 354cc", keywords: ["coca lata 354", "coca-cola lata 354"], pack: 6, color: "#e04848" },
  { categoria: "🥫 Latas 354cc", nombre: "Fanta Lata 354cc", keywords: ["fanta lata 354"], pack: 6, color: "#e87828" },
  { categoria: "🥫 Latas 354cc", nombre: "Sprite Lata 354cc", keywords: ["sprite lata 354"], pack: 6, color: "#48d888" },
  { categoria: "🥫 Latas 354cc", nombre: "Lata genérica (combos sin sabor)", keywords: ["__combo_lata__"], pack: 6, color: "#706860", esComboGenerico: true },

  // 500cc - pack 12
  { categoria: "🍾 Botellas 500cc", nombre: "Coca 500cc", keywords: ["coca 500", "coca-cola 500"], pack: 12, color: "#e04848" },
  { categoria: "🍾 Botellas 500cc", nombre: "Sprite 500cc", keywords: ["sprite 500"], pack: 12, color: "#48d888" },
  { categoria: "🍾 Botellas 500cc", nombre: "Fanta 500cc", keywords: ["fanta 500"], pack: 12, color: "#e87828" },
  { categoria: "🍾 Botellas 500cc", nombre: "Coca Zero 500cc", keywords: ["coca zero 500"], pack: 12, color: "#b8b0a4" },

  // Agua - pack 12
  { categoria: "💧 Agua", nombre: "Agua 500cc", keywords: ["agua 500"], pack: 12, color: "#4898e0" },

  // Aquarius - pack 6
  { categoria: "🌊 Aquarius", nombre: "Aquarius Manzana", keywords: ["aquarius manzana"], pack: 6, color: "#40c8b0" },
  { categoria: "🌊 Aquarius", nombre: "Aquarius Naranja", keywords: ["aquarius naranja"], pack: 6, color: "#40c8b0" },
  { categoria: "🌊 Aquarius", nombre: "Aquarius Pera", keywords: ["aquarius pera"], pack: 6, color: "#40c8b0" },
  { categoria: "🌊 Aquarius", nombre: "Aquarius Pomelo", keywords: ["aquarius pomelo"], pack: 6, color: "#40c8b0" },
  { categoria: "🌊 Aquarius", nombre: "Aquarius Limonada", keywords: ["aquarius limonada"], pack: 6, color: "#40c8b0" },

  // 1L - pack 9
  { categoria: "🍶 Botellas 1L", nombre: "Coca 1L", keywords: ["coca 1l","coca-cola 1l","coca 1 l"], pack: 9, color: "#e04848" },
  { categoria: "🍶 Botellas 1L", nombre: "Coca Zero 1L", keywords: ["coca zero 1l"], pack: 9, color: "#b8b0a4" },
  { categoria: "🍶 Botellas 1L", nombre: "Sprite 1L", keywords: ["sprite 1l"], pack: 9, color: "#48d888" },

  // 1.5L - pack 6
  { categoria: "🍶 Botellas 1.5L", nombre: "Coca 1.5L", keywords: ["coca 1.5","coca-cola 1.5"], pack: 6, color: "#e04848" },
  { categoria: "🍶 Botellas 1.5L", nombre: "Sprite 1.5L", keywords: ["sprite 1.5"], pack: 6, color: "#48d888" },
];

// ── Combos con bebida ──────────────────────────────────────────────────────
const COMBOS_BEBIDA = [
  { match: "pancho + lata 354cc", bebida: "__combo_lata__", qty: 1 },
  { match: "panchos x 2 + coca 1l", bebida: "coca 1l", qty: 1 },
  { match: "pancho x2 + coca 1l", bebida: "coca 1l", qty: 1 },
  { match: "pancho x3 + coca 1l", bebida: "coca 1l", qty: 1 },
  { match: "panchos x3 + coca 1l", bebida: "coca 1l", qty: 1 },
  { match: "panchos x3 + coca 1.5l", bebida: "coca 1.5", qty: 1 },
  { match: "pancho x3 + coca 1.5l", bebida: "coca 1.5", qty: 1 },
  { match: "amigo", bebida: "coca 500", qty: 4 },
  { match: "helados de 1 bocha", bebida: "coca 1l", qty: 1 },
];

function getBebidaForProducto(nombreProducto) {
  const s = (nombreProducto||"").toLowerCase().replace(/pedidos\s*ya/gi,"").trim();
  for (const b of BEBIDAS_CONFIG) {
    if (b.esComboGenerico) continue;
    for (const kw of b.keywords) {
      if (s.includes(kw)) return b;
    }
  }
  return null;
}

function getBebidaCombo(nombreCombo) {
  const s = (nombreCombo||"").toLowerCase();
  for (const c of COMBOS_BEBIDA) {
    if (s.includes(c.match)) return c;
  }
  return null;
}

function getBebidaConfigByKeyword(kw) {
  for (const b of BEBIDAS_CONFIG) {
    if (b.esComboGenerico) continue;
    for (const k of b.keywords) {
      if (kw.includes(k) || k.includes(kw)) return b;
    }
  }
  // Buscar por lata genérica
  if (kw === "__combo_lata__") return BEBIDAS_CONFIG.find(b=>b.esComboGenerico);
  return null;
}

// ── Helpers ────────────────────────────────────────────────────────────────
const today = () => { const d=new Date(); d.setHours(d.getHours()-3); return d.toISOString().slice(0,10); };
const nN = (n) => Number(n||0).toLocaleString("es-AR");

function setShortcut(tipo, el) {
  const t = today();
  const parts = t.split('-');
  const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  let desde, hasta;
  const fmt = (dt) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  if(tipo==='semana'){const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));desde=fmt(mon);hasta=t;}
  else if(tipo==='semana_ant'){const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7)-7);const sun=new Date(mon);sun.setDate(mon.getDate()+6);desde=fmt(mon);hasta=fmt(sun);}
  else if(tipo==='mes'){desde=t.slice(0,7)+"-01";hasta=t;}
  else if(tipo==='mes_ant'){const pm=new Date(d.getFullYear(),d.getMonth()-1,1);const ulm=new Date(d.getFullYear(),d.getMonth(),0);desde=fmt(pm);hasta=fmt(ulm);}
  document.getElementById("inputDesde").value=desde;
  document.getElementById("inputHasta").value=hasta;
  document.querySelectorAll(".sc").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}

async function apiFetch(path) {
  const res = await fetch(API_BASE + path, { headers: { Authorization: "Bearer " + API_KEY } });
  if(!res.ok) throw new Error("API error " + res.status);
  const data = await res.json();
  if(Array.isArray(data)) return data;
  if(data.data) return data.data;
  for(const k of Object.keys(data)) if(Array.isArray(data[k])) return data[k];
  return [];
}

function procesarBebidas(ventas) {
  // Contadores por bebida keyword
  const contadores = {};
  const iniciar = (kw) => { if(!contadores[kw]) contadores[kw] = { individual: 0, combo: 0, total: 0 }; };

  ventas.forEach(v => {
    const nombre = v.producto || "";
    const qty = v.cantidad || 0;

    // Producto individual (incluyendo Pedidos Ya)
    const bConfig = getBebidaForProducto(nombre);
    if (bConfig) {
      const kw = bConfig.keywords[0];
      iniciar(kw);
      contadores[kw].individual += qty;
      contadores[kw].total += qty;
      return;
    }

    // Combo con bebida
    const comboB = getBebidaCombo(nombre);
    if (comboB) {
      const kw = comboB.bebida;
      iniciar(kw);
      contadores[kw].combo += qty * comboB.qty;
      contadores[kw].total += qty * comboB.qty;
    }
  });

  return contadores;
}

function renderResultado(ventas, desde, hasta, sucursal) {
  const contadores = procesarBebidas(ventas);
  const totalOrdenes = new Set(ventas.map(v=>v.orden_id)).size;
  const dFmt = `${desde.slice(8,10)}/${desde.slice(5,7)}/${desde.slice(0,4)}`;
  const hFmt = `${hasta.slice(8,10)}/${hasta.slice(5,7)}/${hasta.slice(0,4)}`;

  // Agrupar por categoría
  const categorias = {};
  BEBIDAS_CONFIG.forEach(b => {
    const kw = b.keywords[0];
    const cnt = contadores[kw] || { individual: 0, combo: 0, total: 0 };
    if (cnt.total === 0 && !b.esComboGenerico) return; // omitir sin ventas
    if (!categorias[b.categoria]) categorias[b.categoria] = [];
    categorias[b.categoria].push({ ...b, ...cnt });
  });

  // Resumen pedido (solo items con ventas)
  const itemsPedido = [];
  BEBIDAS_CONFIG.forEach(b => {
    const kw = b.keywords[0];
    const cnt = contadores[kw] || { total: 0 };
    if (cnt.total === 0) return;
    const packs = cnt.total / b.pack;
    const packsCeil = Math.ceil(packs);
    itemsPedido.push({ nombre: b.nombre, unidades: cnt.total, packs: packs, packsCeil, pack: b.pack, color: b.color });
  });

  let html = `
    <div style="background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px">
      <div style="font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Período analizado</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--mustard)">${dFmt} → ${hFmt}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${sucursal || "Todas las sucursales"} · ${nN(totalOrdenes)} órdenes</div>
    </div>

    <div class="info-box">💡 Las cantidades incluyen bebidas vendidas <strong>individualmente</strong> (salón + Pedidos Ya) más las incluidas en <strong>combos</strong>. Los packs se redondean hacia arriba.</div>

    <!-- RESUMEN PEDIDO -->
    <div class="section">
      <div class="stitle"><span>📋</span>Resumen del Pedido</div>
      <div class="resumen-pedido">
        <div class="resumen-title">PACKS A REPONER</div>
        ${itemsPedido.length === 0 ? '<div style="color:var(--muted);font-size:13px">Sin ventas de bebidas en el período</div>' :
          itemsPedido.map(item => `
          <div class="resumen-item">
            <div>
              <div class="resumen-nombre">${item.nombre}</div>
              <div class="resumen-sub">${nN(item.unidades)} unid. ÷ ${item.pack} = ${item.packs.toFixed(2)} packs</div>
            </div>
            <div style="text-align:right">
              <span class="pack-badge ${item.packsCeil <= 2 ? 'ok' : ''}">${item.packsCeil}</span>
              <div style="font-size:9px;color:var(--muted);margin-top:3px">packs</div>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <!-- DETALLE POR CATEGORÍA -->
    <div class="section">
      <div class="stitle"><span>🔍</span>Detalle por Tipo de Bebida</div>
      ${Object.entries(categorias).map(([cat, items]) => `
        <div class="tw" style="margin-bottom:12px">
          <div class="categoria-header">${cat} · Pack de ${items[0].pack} unidades</div>
          <table class="dt">
            <thead><tr>
              <th>Bebida</th>
              <th class="num">Individual</th>
              <th class="num">En Combos</th>
              <th class="num">Total Unid.</th>
              <th class="num">Packs</th>
            </tr></thead>
            <tbody>
              ${items.map(item => {
                const packs = item.total / item.pack;
                const packsCeil = Math.ceil(packs);
                return `<tr>
                  <td style="font-weight:600;color:${item.color}">${item.nombre}</td>
                  <td class="num">${nN(item.individual)}</td>
                  <td class="num" style="color:#a070e0">${nN(item.combo)}</td>
                  <td class="num" style="color:var(--mustard);font-weight:700">${nN(item.total)}</td>
                  <td class="num"><span class="pack-badge">${packsCeil}</span></td>
                </tr>`;
              }).join('')}
              ${items.length > 1 ? `<tr style="background:var(--s2)">

async function mostrarFormStock() {
  const t = today(); const parts = t.split('-');
  const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
  const day = d.getDay();
  const lun = new Date(d); lun.setDate(d.getDate()-((day+6)%7)-7);
  const hace2sem = new Date(lun); hace2sem.setDate(lun.getDate()-7);
  const fmt = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const sun = new Date(lun); sun.setDate(lun.getDate()+6);

  document.getElementById('inputDesde').value = fmt(hace2sem);
  document.getElementById('inputHasta').value = fmt(sun);

  document.getElementById('mainContent').innerHTML = `<div class="estado"><div class="spinner"></div><div class="estado-title">Cargando stock desde planilla...</div></div>`;

  // Leer último stock de cada local desde Google Sheets
  const [stockSarm, stockTerm, stockShop] = await Promise.all([
    leerUltimoStock(SHEETS.sarmiento),
    leerUltimoStock(SHEETS.terminal),
    leerUltimoStock(SHEETS.shopping),
  ]);

  const parseFecha = (f) => {
    if (!f || f === '0') return 'Sin datos';
    // String formato dd/mm/yyyy o dd/mm/yy
    if (typeof f === 'string' && f.trim()) {
      const s = f.trim();
      // Formato dd/mm/yyyy
      const match = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
      if (match) return s; // ya está en formato es-AR, devolver directo
      // Otros formatos
      const d = new Date(s);
      if (!isNaN(d)) return d.toLocaleDateString('es-AR');
      return s;
    }
    if (typeof f === 'number' && f > 1000) {
      const date = new Date((f - 25569) * 86400 * 1000);
      return date.toLocaleDateString('es-AR');
    }
    return 'Sin datos';
  };
  const fechaSarm = parseFecha(stockSarm?.Fecha);
  const fechaTerm = parseFecha(stockTerm?.Fecha);
  const fechaShop = parseFecha(stockShop?.Fecha);

  document.getElementById('mainContent').innerHTML = `
    <div style="background:rgba(72,152,224,.08);border:1px solid rgba(72,152,224,.25);border-radius:10px;padding:14px 18px;margin-bottom:16px;font-size:12px;color:var(--text2);line-height:1.6">
      📊 <strong style="color:var(--text)">Cómo funciona:</strong> Toma la venta de la última semana × 2 (1 semana de venta + 1 semana de seguridad) y resta el stock del último relevamiento de cada local.
      <br><br>📋 El stock se lee automáticamente desde la planilla Google Sheets. Último relevamiento: <strong style="color:var(--mustard)">Sarmiento: ${fechaSarm} · Terminal: ${fechaTerm} · Shopping: ${fechaShop}</strong>
    </div>
    <div id="stockResumen"></div>
  `;

  // Guardar en window para usar al calcular
  window._stockSheets = { sarmiento: stockSarm, terminal: stockTerm, shopping: stockShop };
}

function renderResultadoStock(ventasSem1, ventasSem2, desde, hasta) {
  // Calcular ventas por bebida en cada semana
  const calc = (ventas) => procesarBebidas(ventas);
  const s1 = calc(ventasSem1);
  const s2 = calc(ventasSem2);

  // Promedio semanal por bebida
  const promedio = {};
  const allKeys = new Set([...Object.keys(s1), ...Object.keys(s2)]);
  allKeys.forEach(kw => {
    const t1 = s1[kw]?.total || 0;
    const t2 = s2[kw]?.total || 0;
    promedio[kw] = Math.ceil((t1 + t2) / 2); // promedio en unidades
  });

  // Calcular pedido por depósito
  const renderDeposito = (titulo, formId, sucursales) => {
    const rows = [];
    BEBIDAS_CONFIG.forEach(b => {
      if(b.esComboGenerico) return;
      const kw = b.keywords[0];
      const promSem = promedio[kw] || 0;
      if(promSem === 0) return;
      const necesario = promSem * 2; // 2 semanas
      const stockPacks = getStockPacks(formId, b);
      const stockUnidades = stockPacks * b.pack;
      const pedidoUnidades = Math.max(0, necesario - stockUnidades);
      const pedidoPacks = Math.ceil(pedidoUnidades / b.pack);
      rows.push({ b, promSem, necesario, stockPacks, stockUnidades, pedidoUnidades, pedidoPacks });

        ${rows.map(r => `
          <div class="resumen-item">
            <div>
              <div class="resumen-nombre">${r.b.nombre}</div>
              <div class="resumen-sub">Prom. sem: ${nN(r.promSem)} und · Necesario: ${nN(r.necesario)} und · Stock: ${r.stockPacks} packs (${nN(r.stockUnidades)} und)</div>
            </div>
            <div style="text-align:right">
              <span class="pack-badge ${r.pedidoPacks === 0 ? 'ok' : ''}">${r.pedidoPacks}</span>
              <div style="font-size:9px;color:var(--muted);margin-top:3px">${r.pedidoPacks === 0 ? '✅ OK' : 'packs'}</div>
            </div>
          </div>`).join('')}
      </div>
      <div class="tw" style="margin-bottom:20px">
        <div class="categoria-header">Detalle completo</div>
        <table class="dt">
          <thead><tr>
            <th>Bebida</th>
            <th class="num">Prom. sem.</th>
            <th class="num">Necesario 2sem</th>
            <th class="num">Stock actual</th>
            <th class="num">A pedir</th>
            <th class="num">Packs</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td style="font-weight:600;color:${r.b.color}">${r.b.nombre}</td>
              <td class="num">${nN(r.promSem)}</td>
              <td class="num">${nN(r.necesario)}</td>
              <td class="num" style="color:${r.stockUnidades>=r.necesario?'#48d888':'#e04848'}">${nN(r.stockUnidades)} (${r.stockPacks}pk)</td>
              <td class="num" style="color:${r.pedidoPacks===0?'#48d888':'#f0c040'};font-weight:700">${nN(r.pedidoUnidades)}</td>
              <td class="num"><span class="pack-badge ${r.pedidoPacks===0?'ok':''}">${r.pedidoPacks}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  };

  const dFmt = `${desde.slice(8,10)}/${desde.slice(5,7)}`;
  const hFmt = `${hasta.slice(8,10)}/${hasta.slice(5,7)}/${hasta.slice(0,4)}`;

  document.getElementById('mainContent').innerHTML = `
    <div style="background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px">
      <div style="font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Período analizado (2 semanas)</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--mustard)">${dFmt} → ${hFmt}</div>

const SHEET_ID = "1fpTxKtlBI-ObV8Ve-JNETddZkVkyN83J_CShNAoJPaQ";
const SHEETS = {
  sarmiento: "COCA SARMIENTO",
  terminal: "COCA TERMINAL",
  shopping: "COCA SHOPPING",
};

async function leerUltimoStock(sheetName) {
  try {
    // Usar JSON que no tiene problemas de parsing con fechas
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&tq=${encodeURIComponent('select * limit 1000')}`;
    const res = await fetch(url, { mode: 'cors' });
    const text = await res.text();
    // Google envuelve la respuesta en google.visualization.Query.setResponse(...)
    const jsonStr = text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, '');
    const json = JSON.parse(jsonStr);
    const rows = json.table?.rows || [];
    const cols = json.table?.cols || [];
    
    // Buscar última fila no vacía
    let lastRow = null;
    for (let i = rows.length - 1; i >= 0; i--) {
      if (rows[i].c && rows[i].c[0]?.v) { lastRow = rows[i]; break; }
    }
    if (!lastRow) return null;

    const obj = {};
    cols.forEach((col, i) => {
      const cell = lastRow.c[i];
      // Para fechas, Google devuelve objeto Date o string formateado
      if (col.type === 'date' && cell?.v) {
        // cell.f tiene el formato local, cell.v tiene Date(yyyy,mm,dd)
        obj[col.label] = cell.f || cell.v;
      } else {
        obj[col.label] = cell?.v ?? 0;
      }
    });

    console.log('Stock leído:', sheetName, obj);
    return obj;
  } catch(e) {
    console.error('Error leyendo sheet:', sheetName, e);
    return null;
  }
}

function getStockFromSheet(stockData, bebida) {
  if (!stockData) return 0;
  // Buscar columna que matchee con la bebida
  for (const col of Object.keys(stockData)) {
    const colLower = col.toLowerCase().trim();
    for (const kw of bebida.keywords) {
      if (colLower === kw || colLower.includes(kw) || kw.includes(colLower)) {
        return Number(stockData[col]) || 0;
      }
    }
    // También por nombre de bebida
    if (colLower === bebida.nombre.toLowerCase() || bebida.nombre.toLowerCase().includes(colLower)) {
      return Number(stockData[col]) || 0;
    }
  }
  return 0;
}
